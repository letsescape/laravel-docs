services:
  # 사이트 빌드(Node)
  build:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./build:/app/build

  # 문서 동기화·번역
  translate:
    build:
      context: .
      dockerfile: Dockerfile.translate
    init: true
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: translation-sync-python-environment
        target: /home/app/.venv
      - type: volume
        source: translation-sync-uv-cache
        target: /home/app/.cache/uv

volumes:
  translation-sync-python-environment:
  translation-sync-uv-cache:
