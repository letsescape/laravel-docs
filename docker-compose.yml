services:
  # 사이트 빌드(Node)
  build:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./build:/app/build

  # 격리 문서 갱신·번역 workflow
  translate:
    build:
      context: .
      dockerfile: Dockerfile.translate
    init: true
    working_dir: /workspace
    env_file:
      - path: translation-sync/.env
        required: false
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: translation-sync-artifacts
        target: /artifacts
      - type: volume
        source: translation-sync-python-environment
        target: /home/app/.venv
      - type: volume
        source: translation-sync-uv-cache
        target: /home/app/.cache/uv

volumes:
  translation-sync-artifacts:
  translation-sync-python-environment:
  translation-sync-uv-cache:
