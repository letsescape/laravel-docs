name: Sync Documentation Translation

# translation-sync/docs/05(T4) 트리거. 공식 원문을 받아 변경분을 번역해 실행 브랜치에 커밋한다(main일 때만 배포).
on:
  schedule:
    - cron: '0 13 */2 * *'   # 2일마다 22:00 KST (매월 홀수일)
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version filter, e.g. 13.x'
        required: false
        type: string
      doc:
        description: 'Optional Markdown file filter, e.g. installation.md'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-translation
  cancel-in-progress: false

jobs:
  sync:
    name: Sync translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup uv (Python 3.14)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: translation-sync
        run: uv sync --frozen

      - name: Run translation sync tests
        working-directory: translation-sync
        run: PYTHONPATH=. uv run --with pytest pytest

      - name: Run translation sync
        working-directory: translation-sync
        env:
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DOC: ${{ inputs.doc }}
        run: |
          args=(--fail-fast)
          if [ -n "$INPUT_VERSION" ]; then
            args+=(--version "$INPUT_VERSION")
          fi
          if [ -n "$INPUT_DOC" ]; then
            args+=(--doc "$INPUT_DOC")
          fi
          uv run python main.py "${args[@]}"

      - name: Commit, push, and trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
          # 실행 브랜치(스케줄은 기본 브랜치=main, 수동 실행은 dispatch한 브랜치).
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit; skipping.'
            exit 0
          fi
          git add -A
          git commit -m 'chore(translation): sync documentation'
          # 결과는 항상 실행한 브랜치로 커밋한다(develop에서 실행 → develop에 커밋).
          git push origin "HEAD:${TARGET_BRANCH}"
          # 배포는 기본 브랜치(main)에 반영됐을 때만 한다.
          # 기본 GITHUB_TOKEN push는 deploy.yml(on: push)을 자동 발화하지 않으므로
          # 배포 워크플로를 명시적으로 트리거한다(workflow_dispatch는 허용되는 예외).
          if [ "$TARGET_BRANCH" = 'main' ]; then
            gh workflow run deploy.yml --ref main
          else
            echo "Target branch '${TARGET_BRANCH}' is not main; skipping deploy."
          fi
