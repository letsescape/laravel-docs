name: Sync Documentation Translation

on:
  schedule:
    - cron: '0 13 */2 * *'  # 매월 홀수일 22:00 KST
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version filter, e.g. 13.x'
        required: false
        type: string
      doc:
        description: 'Optional Markdown path, e.g. collections.md'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-translation
  cancel-in-progress: false

jobs:
  sync:
    name: Sync translations
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch ref
        run: |
          if [ "$GITHUB_REF_TYPE" != 'branch' ]; then
            echo "Translation sync requires a branch ref, got '$GITHUB_REF_TYPE'." >&2
            exit 1
          fi

      - name: Checkout without write credential
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv and Python 3.14
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Initialize external artifact root
        run: |
          root="$RUNNER_TEMP/translation-sync-artifacts"
          mkdir -- "$root"
          chmod 700 "$root"

      - name: Prepare verified publication
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DOC: ${{ inputs.doc }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          args=(
            prepare
            --artifact-root "$RUNNER_TEMP/translation-sync-artifacts"
            --push-endpoint "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
            --branch "$GITHUB_REF_NAME"
            --repository "$GITHUB_REPOSITORY"
          )
          if [ -n "$INPUT_VERSION" ]; then
            args+=(--version "$INPUT_VERSION")
          fi
          if [ -n "$INPUT_DOC" ]; then
            args+=(--doc "$INPUT_DOC")
          fi
          uv run --directory translation-sync --locked --no-build --python 3.14 \
            python workflow.py "${args[@]}"

      - name: Publish verified tree with compare-and-swap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --directory translation-sync --locked --no-build --python 3.14 \
            python workflow.py publish \
            --artifact-root "$RUNNER_TEMP/translation-sync-artifacts"

      - name: Trigger and verify production deployment
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --directory translation-sync --locked --no-build --python 3.14 \
            python workflow.py deploy \
            --artifact-root "$RUNNER_TEMP/translation-sync-artifacts"

      - name: Upload redacted workflow evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: translation-sync-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/translation-sync-artifacts/translation-sync-failure.json
            ${{ runner.temp }}/translation-sync-artifacts/translation-sync-*-failure.json
            ${{ runner.temp }}/translation-sync-artifacts/translation-sync-fixture-evidence.txt
            ${{ runner.temp }}/translation-sync-artifacts/translation-sync-manifest.json
            ${{ runner.temp }}/translation-sync-artifacts/translation-sync-published.json
            ${{ runner.temp }}/translation-sync-artifacts/translation-sync-deployed.json
