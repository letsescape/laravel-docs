name: Sync Documentation Translation

on:
  schedule:
    - cron: '0 13 */2 * *'  # 매월 홀수일 22:00 KST
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version filter, e.g. 13.x'
        required: false
        type: string
      doc:
        description: 'Optional Markdown path, e.g. collections.md'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-translation
  cancel-in-progress: false

jobs:
  sync:
    name: Sync translations
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Validate branch ref
        run: |
          if [ "$GITHUB_REF_TYPE" != 'branch' ]; then
            echo "Translation sync requires a branch ref, got '$GITHUB_REF_TYPE'." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup uv and Python 3.14
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Run translation sync tests
        run: |
          uv run --directory translation-sync --locked --no-build --python 3.14 \
            python -m unittest discover -s tests

      - name: Run translation sync
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DOC: ${{ inputs.doc }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          args=()
          if [ -n "$INPUT_VERSION" ]; then
            args+=(--version "$INPUT_VERSION")
          fi
          if [ -n "$INPUT_DOC" ]; then
            args+=(--doc "$INPUT_DOC")
          fi
          uv run --directory translation-sync --locked --no-build --python 3.14 \
            python main.py "${args[@]}"

      - name: Commit synchronized documents
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- i18n versioned_docs versioned_sidebars
          if git diff --cached --quiet; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: synchronize translations'
          git push \
            "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY" \
            "HEAD:$GITHUB_REF_NAME"
