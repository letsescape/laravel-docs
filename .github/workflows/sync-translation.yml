name: Sync Documentation Translation

on:
  schedule:
    - cron: '0 13 */2 * *'  # 매월 홀수일 22:00 KST
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version filter, e.g. 13.x'
        required: false
        type: string
      doc:
        description: 'Optional Markdown path, e.g. collections.md'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-translation
  cancel-in-progress: false

jobs:
  sync:
    name: Sync translations
    runs-on: ubuntu-latest
    env:
      TRANSLATION_ARTIFACT_ROOT: ${{ runner.temp }}/translation-sync-artifacts
      TRANSLATION_PUSH_ENDPOINT: ${{ github.server_url }}/${{ github.repository }}.git
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Validate branch ref
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != 'branch' ]; then
            echo "Translation sync requires a branch ref, got '$REF_TYPE'." >&2
            exit 1
          fi

      - name: Checkout without write credential
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv and Python 3.14
        uses: astral-sh/setup-uv@v9
        with:
          python-version: '3.14'

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Codex CLI when selected
        env:
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER }}
        run: |
          if [ "$TRANSLATION_PROVIDER" != 'cli' ]; then
            exit 0
          fi
          npm install --global --ignore-scripts @openai/codex@latest \
            --registry=https://registry.npmjs.org
          codex --version

      - name: Initialize external artifact root
        run: |
          mkdir -- "$TRANSLATION_ARTIFACT_ROOT"
          chmod 700 "$TRANSLATION_ARTIFACT_ROOT"

      - name: Prepare verified publication
        env:
          CI: 'true'
          NODE_OPTIONS: --max-old-space-size=4096
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DOC: ${{ inputs.doc }}
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
          TRANSLATION_MODEL_PROFILE: ${{ vars.TRANSLATION_MODEL_PROFILE }}
          TRANSLATION_REASONING_EFFORT: ${{ secrets.TRANSLATION_REASONING_EFFORT }}
          TRANSLATION_CONTEXT_WINDOW_TOKENS: ${{ vars.TRANSLATION_CONTEXT_WINDOW_TOKENS }}
          TRANSLATION_RESERVED_OUTPUT_TOKENS: ${{ vars.TRANSLATION_RESERVED_OUTPUT_TOKENS }}
          TRANSLATION_REQUEST_TIMEOUT_SECONDS: ${{ vars.TRANSLATION_REQUEST_TIMEOUT_SECONDS }}
          TRANSLATION_RUN_TIMEOUT_SECONDS: ${{ vars.TRANSLATION_RUN_TIMEOUT_SECONDS }}
          TRANSLATION_WORKFLOW_TIMEOUT_SECONDS: '7200'
          TRANSLATION_TOKENIZER_ENCODING: ${{ vars.TRANSLATION_TOKENIZER_ENCODING }}
          TRANSLATION_CLI_COMMAND: ${{ vars.TRANSLATION_CLI_COMMAND }}
          TRANSLATION_CLI_TIMEOUT: ${{ vars.TRANSLATION_CLI_TIMEOUT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_HOME: ${{ vars.CODEX_HOME }}
        run: |
          args=(
            prepare
            --artifact-root "$TRANSLATION_ARTIFACT_ROOT"
            --push-endpoint "$TRANSLATION_PUSH_ENDPOINT"
            --branch "$TARGET_BRANCH"
            --repository "$GITHUB_REPOSITORY"
          )
          if [ -n "$INPUT_VERSION" ]; then
            args+=(--version "$INPUT_VERSION")
          fi
          if [ -n "$INPUT_DOC" ]; then
            args+=(--doc "$INPUT_DOC")
          fi
          uv run --directory translation-sync --locked --no-build --python 3.14 \
            python workflow.py "${args[@]}"

      - name: Publish verified tree with compare-and-swap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --directory translation-sync --locked --no-build --python 3.14 \
            python workflow.py publish \
            --artifact-root "$TRANSLATION_ARTIFACT_ROOT"

      - name: Trigger and verify production deployment
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --directory translation-sync --locked --no-build --python 3.14 \
            python workflow.py deploy \
            --artifact-root "$TRANSLATION_ARTIFACT_ROOT"

      - name: Upload redacted workflow evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: translation-sync-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ env.TRANSLATION_ARTIFACT_ROOT }}/translation-sync-failure.json
            ${{ env.TRANSLATION_ARTIFACT_ROOT }}/translation-sync-*-failure.json
            ${{ env.TRANSLATION_ARTIFACT_ROOT }}/translation-sync-fixture-evidence.txt
            ${{ env.TRANSLATION_ARTIFACT_ROOT }}/translation-sync-manifest.json
            ${{ env.TRANSLATION_ARTIFACT_ROOT }}/translation-sync-published.json
            ${{ env.TRANSLATION_ARTIFACT_ROOT }}/translation-sync-deployed.json
