name: Sync Documentation Translation

# translation-sync/docs/05(T4) 트리거. 공식 원문을 받아 변경분을 번역해 main에 직접 커밋한다.
on:
  schedule:
    - cron: '0 13 */2 * *'   # 2일마다 22:00 KST (매월 홀수일)
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version filter, e.g. 13.x'
        required: false
        type: string
      doc:
        description: 'Optional Markdown file filter, e.g. installation.md'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-translation
  cancel-in-progress: false

jobs:
  sync:
    name: Sync translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Setup uv (Python 3.14)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: translation-sync
        run: uv sync --frozen

      - name: Run translation sync tests
        working-directory: translation-sync
        run: PYTHONPATH=. uv run --with pytest pytest

      - name: Run translation sync
        working-directory: translation-sync
        env:
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DOC: ${{ inputs.doc }}
        run: |
          args=(--fail-fast)
          if [ -n "$INPUT_VERSION" ]; then
            args+=(--version "$INPUT_VERSION")
          fi
          if [ -n "$INPUT_DOC" ]; then
            args+=(--doc "$INPUT_DOC")
          fi
          uv run python main.py "${args[@]}"

      - name: Commit, push, and trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit; skipping.'
            exit 0
          fi
          git add -A
          git commit -m 'chore(translation): sync documentation'
          git push origin HEAD:main
          # 기본 GITHUB_TOKEN push는 deploy.yml(on: push)을 자동 발화하지 않으므로
          # 배포 워크플로를 명시적으로 트리거한다(workflow_dispatch는 허용되는 예외).
          gh workflow run deploy.yml --ref main
