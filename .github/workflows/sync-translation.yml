name: Sync Documentation Translation

# translation-sync/docs/05(T4) 트리거. 공식 원문을 받아 변경분을 번역해 실행 브랜치에 커밋한다(main일 때만 배포).
on:
  schedule:
    - cron: '17 13 */2 * *'  # 매월 홀수일 22:17 KST
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version filter, e.g. 13.x'
        required: false
        type: string
      doc:
        description: 'Optional Markdown file filter, e.g. installation.md'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-translation
  cancel-in-progress: false

jobs:
  sync:
    name: Sync translations
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch ref
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != 'branch' ]; then
            echo "Translation sync requires a branch ref, got '$REF_TYPE'." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv (Python 3.14)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.11.32'
          python-version: '3.14'

      - name: Install dependencies
        working-directory: translation-sync
        run: uv sync --locked

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          cache: npm

      - name: Install site dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Run translation preflight
        env:
          VERSION: ${{ inputs.version }}
          DOC: ${{ inputs.doc }}
          MANIFEST: ${{ runner.temp }}/translation-upstream-refs.json
        run: |
          status=0
          make translation-check || status=$?
          if [ ! -s "$MANIFEST" ]; then
            echo 'Translation preflight did not produce pinned upstream refs.' >&2
            if [ "$status" -eq 0 ]; then
              status=1
            fi
            exit "$status"
          fi
          echo 'Pinned upstream refs:'
          cat "$MANIFEST"
          exit "$status"

      - name: Verify live provider contract
        env:
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
          TRANSLATION_REASONING_EFFORT: ${{ secrets.TRANSLATION_REASONING_EFFORT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: make translation-provider-check

      - name: Run translation sync
        env:
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
          TRANSLATION_REASONING_EFFORT: ${{ secrets.TRANSLATION_REASONING_EFFORT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          VERSION: ${{ inputs.version }}
          DOC: ${{ inputs.doc }}
          MANIFEST: ${{ runner.temp }}/translation-upstream-refs.json
        run: make translation-run

      - name: Verify generated site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: make site-check

      - name: Verify generated file scope
        run: make translation-artifact-check

      - name: Commit changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit; skipping.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m 'chore(translation): sync documentation'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # 실행 브랜치(스케줄은 기본 브랜치=main, 수동 실행은 dispatch한 브랜치).
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          # Checkout deliberately leaves no write credential for dependency,
          # verification, or commit hooks. Configure it only for the push step.
          gh auth setup-git
          # 결과는 항상 실행한 브랜치로 커밋한다(develop에서 실행 → develop에 커밋).
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Trigger deploy
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 배포는 기본 브랜치(main)에 반영됐을 때만 한다.
          # 기본 GITHUB_TOKEN push는 deploy.yml(on: push)을 자동 발화하지 않으므로
          # 배포 워크플로를 명시적으로 트리거한다(workflow_dispatch는 허용되는 예외).
          # 커밋 이후 dispatch만 실패한 실행도 no-change 재실행으로 복구할 수 있게
          # commit step과 분리하여 main에서는 항상 dispatch한다.
          gh workflow run deploy.yml --ref main
