name: Deploy to GitHub Pages
run-name: ${{ github.event_name == 'workflow_dispatch' && format('translation-deploy:{0}', inputs.correlation_id) || format('deploy:{0}', github.sha) }}

on:
  push:
    branches:
      - main
    # 특정 파일 변경 시에만 실행하려면 paths 필터 설정
    # paths:
    #   - docs/**
    #   - src/**
    #   - docusaurus.config.ts
    #   - sidebars.ts

  # 수동 워크플로 실행 허용
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Full commit OID that must be deployed'
        required: true
        type: string
      correlation_id:
        description: 'Opaque translation run correlation identifier'
        required: true
        type: string

# 동시 배포를 하나로 제한
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          ACTUAL_COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != 'branch' ] || [ "$REF_NAME" != 'main' ]; then
            echo "Production deployment requires the main branch." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            case "$CORRELATION_ID" in
              ''|[!A-Za-z0-9]*|*[!A-Za-z0-9._-]*)
                echo 'correlation_id contains unsupported characters.' >&2
                exit 1
                ;;
            esac
            if [ "${#CORRELATION_ID}" -gt 64 ]; then
              echo 'correlation_id is too long.' >&2
              exit 1
            fi
            case "$EXPECTED_COMMIT" in
              ''|*[!0-9a-f]*)
                echo 'expected_commit must be a lowercase full commit OID.' >&2
                exit 1
                ;;
            esac
            if { [ "${#EXPECTED_COMMIT}" -ne 40 ] && [ "${#EXPECTED_COMMIT}" -ne 64 ]; } || \
              [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
              echo "Deployment commit mismatch: expected '$EXPECTED_COMMIT', got '$ACTUAL_COMMIT'." >&2
              exit 1
            fi
          fi
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Markdown link utilities
        run: npm run test:markdown-links
      - name: Typecheck
        run: npm run typecheck -- --pretty false
      - name: Build website
        run: npm run build
      - name: Validate anchors
        run: npm run validate-anchors
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
