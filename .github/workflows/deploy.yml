name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # 특정 파일 변경 시에만 실행하려면 paths 필터 설정
    # paths:
    #   - docs/**
    #   - src/**
    #   - docusaurus.config.ts
    #   - sidebars.ts

  # 번역 동기화가 main에서 성공하면 이어서 배포
  # 기본 GITHUB_TOKEN이 만든 push는 워크플로를 트리거하지 않으므로 완료 이벤트를 사용
  workflow_run:
    workflows:
      - Sync Documentation Translation
    types:
      - completed

  # 수동 워크플로 실행 허용
  workflow_dispatch:

# 동시 배포를 하나로 제한
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gate:
    name: Check deployment trigger
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check translation sync result
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SYNC_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SYNC_BASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" != 'workflow_run' ]; then
            echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SYNC_CONCLUSION" != 'success' ] || [ "$SYNC_BRANCH" != 'main' ]; then
            echo "Translation sync concluded '$SYNC_CONCLUSION' on '$SYNC_BRANCH'; skipping deployment."
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$current_sha" = "$SYNC_BASE_SHA" ]; then
            echo 'Translation sync committed no changes; skipping deployment.'
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Translation sync advanced main to $current_sha; continuing to deployment."
          echo 'should_deploy=true' >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    steps:
      - name: Validate deployment branch
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != 'branch' ] || [ "$REF_NAME" != 'main' ]; then
            echo "Production deployment requires the main branch." >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Markdown link utilities
        run: npm run test:markdown-links
      - name: Security boundary tests
        run: npm run test:security
      - name: Typecheck
        run: npm run typecheck -- --pretty false
      - name: Build website
        run: npm run build
      - name: Validate anchors
        run: npm run validate-anchors
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
