name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
    # 특정 파일이 변경되었을 때만 실행하도록 설정할 수도 있습니다
    # paths:
    #   - docs/**
    #   - src/**
    #   - docusaurus.config.js
    #   - sidebars.js

  # 수동으로 워크플로우를 실행할 수 있도록 설정
  workflow_dispatch:

# 동시에 하나의 배포만 실행되도록 설정
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install Python dependencies
        working-directory: .github/docs-updater
        run: uv sync --frozen
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install Node dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck -- --pretty false
      - name: Build website
        run: npm run build
      - name: Generate latest docs redirects
        working-directory: .github/docs-updater
        run: uv run python build_redirect_generator.py
      - name: Validate built site anchors
        working-directory: .github/docs-updater
        run: uv run python build_anchor_validator.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
