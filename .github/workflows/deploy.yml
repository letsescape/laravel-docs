name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # 특정 파일 변경 시에만 실행하려면 paths 필터 설정
    # paths:
    #   - docs/**
    #   - src/**
    #   - docusaurus.config.ts
    #   - sidebars.ts

  # 번역 동기화가 main에서 성공하면 이어서 배포
  # 기본 GITHUB_TOKEN이 만든 push는 워크플로를 트리거하지 않으므로 완료 이벤트를 사용
  workflow_run:
    workflows:
      - Sync Documentation Translation
    types:
      - completed

  # 수동 워크플로 실행 허용
  workflow_dispatch:

# 동시 배포를 하나로 제한
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # 이어받은 실행은 번역 동기화가 main에서 성공했을 때만 배포한다.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Validate deployment branch
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != 'branch' ] || [ "$REF_NAME" != 'main' ]; then
            echo "Production deployment requires the main branch." >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Markdown link utilities
        run: npm run test:markdown-links
      - name: Typecheck
        run: npm run typecheck -- --pretty false
      - name: Build website
        run: npm run build
      - name: Validate anchors
        run: npm run validate-anchors
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
